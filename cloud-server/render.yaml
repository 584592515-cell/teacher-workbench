services:
  - type: web
    name: teacher-workbench
    env: node
    rootDir: cloud-server
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATA_DIR
        value: data
